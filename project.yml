name: Cova

options:
  bundleIdPrefix: cn.covalink
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.0"

packages:
  CovaCore:
    path: Packages/CovaCore
  CovaPlayer:
    path: Packages/CovaPlayer
  CovaUI:
    path: Packages/CovaUI
  CovaFeature:
    path: Packages/CovaFeature

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES

configs:
  Debug: debug
  Release: release

fileGroups:
  - README.md
  - AGENTS.md
  - docs

targets:
  Cova:
    type: application
    platform: iOS
    sources:
      - path: Cova
      - path: design/assets/CovaAssets.xcassets
        buildPhase: resources
    dependencies:
      - package: CovaFeature
    settings:
      base:
        PRODUCT_NAME: Cova
        PRODUCT_BUNDLE_IDENTIFIER: cn.covalink.ios
        # 版本（AGENTS.md：每次 commit 递增，小迭代 +0.0.1 / 大迭代 +0.1）
        # 0.1.0/1 骨架 → ... → 0.2.4/15 G3-a 验收落证
        # → 0.2.5/16 G3-b 幂等键/Keychain 封装/owner 绑定持久化
        # → 0.2.6/17 G3-b 评审修复（M1/M2 + m1..m7）
        # → 0.2.7/18 G3-b 验收落证
        # → 0.2.8/19 G3-c API client/认证状态机/single-flight refresh（含 TD-22/23/24）
        # → 0.2.9/20 G3-c 评审修复（M-1 会话绑定 / M-2 restoreSession / m-1..m-4）
        # → 0.2.10/21 G3-c 复审修复（刷新失败归属复核 + 按账号分桶单飞 + 指针 0600 + guest 竞态）
        # → 0.2.11/22 G3-c 三审修复（等待者归属复核 F1 / me 吊销清理 F2 / restore 提交原子性 F3）
        # → 0.2.12/23 G3-c 验收落证
        # → 0.2.13/24 G3-d SSE 增量解析器 + 降级状态机（D6）
        # → 0.2.14/25 G3-d 评审修复（M1 竞态/M2 单次使用/M3 SSE 超时/M4 测试竞态 + m1..m5）
        # → 0.2.15/26 G3-d 复审修复（F1 check.sh 日志解析 / F2 SSE 请求超时钉死 / F3 start 窗口内 cancel）
        # → 0.2.16/27 G3-d 三审修复（M-1 确定性取消 / Minor-1 超长行坏事件口径 / Minor-2 回包∥取消回归）
        CFBundleShortVersionString: "0.2.16"
        CFBundleVersion: "27"
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  CovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CovaTests
    dependencies:
      - target: Cova
      - package: CovaCore
      - package: CovaPlayer
      - package: CovaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.covalink.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cova.app/Cova"

schemes:
  Cova:
    build:
      targets:
        Cova: all
        CovaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CovaTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
