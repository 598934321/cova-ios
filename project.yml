name: Cova

options:
  bundleIdPrefix: cn.covalink
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.0"

packages:
  CovaCore:
    path: Packages/CovaCore
  CovaPlayer:
    path: Packages/CovaPlayer
  CovaUI:
    path: Packages/CovaUI
  CovaFeature:
    path: Packages/CovaFeature

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES

configs:
  Debug: debug
  Release: release

fileGroups:
  - README.md
  - DEVELOPMENT.md
  - docs

targets:
  Cova:
    type: application
    platform: iOS
    sources:
      - path: Cova
      - path: design/assets/CovaAssets.xcassets
        buildPhase: resources
    dependencies:
      - package: CovaFeature
    settings:
      base:
        PRODUCT_NAME: Cova
        PRODUCT_BUNDLE_IDENTIFIER: cn.covalink.ios
        # 版本（DEVELOPMENT.md §2 协作约定：纯文档 commit 不递增；影响产物的 commit 递增两个字段，小 +0.0.1 / 大 +0.1）
        # 0.1.0/1 骨架 → ... → 0.2.4/15 G3-a 验收落证
        # → 0.2.5/16 G3-b 幂等键/Keychain 封装/owner 绑定持久化
        # → 0.2.6/17 G3-b 评审修复（M1/M2 + m1..m7）
        # → 0.2.7/18 G3-b 验收落证
        # → 0.2.8/19 G3-c API client/认证状态机/single-flight refresh（含 TD-22/23/24）
        # → 0.2.9/20 G3-c 评审修复（M-1 会话绑定 / M-2 restoreSession / m-1..m-4）
        # → 0.2.10/21 G3-c 复审修复（刷新失败归属复核 + 按账号分桶单飞 + 指针 0600 + guest 竞态）
        # → 0.2.11/22 G3-c 三审修复（等待者归属复核 F1 / me 吊销清理 F2 / restore 提交原子性 F3）
        # → 0.2.12/23 G3-c 验收落证
        # → 0.2.13/24 G3-d SSE 增量解析器 + 降级状态机（D6）
        # → 0.2.14/25 G3-d 评审修复（M1 竞态/M2 单次使用/M3 SSE 超时/M4 测试竞态 + m1..m5）
        # → 0.2.15/26 G3-d 复审修复（F1 check.sh 日志解析 / F2 SSE 请求超时钉死 / F3 start 窗口内 cancel）
        # → 0.2.16/27 G3-d 三审修复（M-1 确定性取消 / Minor-1 超长行坏事件口径 / Minor-2 回包∥取消回归）
        # → 0.2.17/28 G3-d 四审修复（M-1 cancel 后不再发起传输 / Minor-1 幂等测试口径 / Minor-2 轮询节拍锚定完成时刻）
        # → 0.2.18/29 G3-d 五审修复（M-1 轮询入口取消守卫 / Minor-1 SSE 生产分支测试 / Minor-2 死代码清理）
        # → 0.2.19/30 G3-d 取消语义有界化（D16：周期停止/在途取消；TD-34 测试注入点）
        # → 0.2.20/31 G3-d 六审修复（M-1 去 flake 断言 / Minor-1 死守卫清理 / Minor-2 覆盖补齐 / Minor-3 TD-34）
        # → 0.2.21/32 G3-d 七审：全仓清扫轮询/传输取消竞态断言 + StubURLProtocol 静态状态加锁
        # → 0.2.22/33 G3-d 九审修复：协调器测试套件确定性化（信号式等待 + 定时器注册推进原语 + TD-34 结束注入点）
        # → 0.2.23/34 G3-d 十审通过落证（零 Critical/Major；130000 执行 0 flake；TD-35/36/37 登记）
        # → 0.2.24/35 HANDOVER 落证 G1 方向稿产出（待用户验收）
        # → 0.2.25/36 门禁新增「播放器层无 UI」不变量（硬边界 8 机械化 + 源集合非空反向守卫）
        # → 0.2.26/37 轨道 B：G2 逐屏规格 04–18（18 份）+ inventory 链接与裁决口径
        # → 0.2.27/38 G3-e CovaPlayer：队列/循环三态/±15s/中断与路由/上报幂等/私有音频落盘
        #     + 门禁新增 8/10 播放器 iOS 测试、9/10 播放器行覆盖率 ≥80%（TD-1 清偿）、PLAYER_MIN=253（TD-11 口径对齐）
        # → 0.2.28/39 G3-e 环 2 提交 + 停放修正（HANDOVER §9）
        # → 0.2.29/40 G3-e 环 4 修复 ①：状态机与集次守卫（C1 释放后迟到装载、P1/P1b/P1c 失败态归约、
        #     P2 装载代际、P3 teardown 终态、P4 装载代际事件闸门、P5 单曲循环逐次上报、M10 就绪不翻回播放、M11 门面永久下线）
        # → 0.2.32/43 G3-e 环 4 私有音频收尾组：补 C2/M5/M6/M8/m12/m13/m14 的永久测试（38 条）+
        #     修 M7（并发在途去重）/ M4·F-13（登出换号必须清私有音频）/ M3（生产默认真注册音频会话通知）
        # → 0.2.34/45 G3-e 环 4 状态机组 F-1…F-8：续体守卫收敛（装载代际 + 引擎归属 + 用户意图三条件一处定义）+
        #     在途装载台账（迟到失败归因 / 在途 seek 拒绝 / load 失败被消费）+ 推进结果与快照自洽 + `.loading` 语义诚实化
        # → 0.2.39/50 G3-e 环 4 第 5 批 F-A/F-B/F-C：`.repeated` 两条腿分离（良性导航不再进伪失败终态、保持位置与引擎账本）+
        #     失效面清失败账、快照暴露 `tornDown` + 上报集次「在途标记」（提交与回前台补发重叠不再写两次）
        # → 0.2.42/53 G3-e 环 4 第 7 批组 1：系统面注册与析构（MAJ-5 注册与激活脱钩 + 门面不吞错、
        #     MAJ-7 三层 deinit 兜底 + 自引用环打破、min-1 缓存目录位 0700）+ 13 条永久测试 + 7 处变异自证
        #     （接手时 HEAD 已是 0.2.41/52，非派单里写的 0.2.39/50 ⇒ 组 1 取 42/53、组 2 取 43/54）
        # → 0.2.43/54 G3-e 环 4 第 7 批组 2：锁屏命令桥异步化（MAJ-6 受理码与投递分离、
        #     无超时信号量删除）+ 共享命令面所有权可查询（min-6，残留立 TD-43）+
        #     min-4 离线不可证立 TD-44；5 条永久测试 + 4 处变异自证 + 500 迭代抓到并改掉
        #     本批自己写的一条竞态断言
        # → 0.2.46/57 G3-e 环 4 第 10 批（第 5 轮复审 §E 两条）：MAJ-R5-1 `.repeated` 腿 (b)
        #     按「有没有失败账」分流（无失败不再产出失败终态，三条复现路径各一条永久测试 +
        #     矩阵基态 2→4 列）+ MIN-R5-4 失效面（登出/换号/换代）在共用收敛点清系统回显面
        #     （`clear()` 而非 `teardown()`）+ 正向对照；5 条永久测试 + 4 处变异自证
        #     （45/56 已被第 9 批的在途工作树占用 ⇒ 本批取 46/57，见 commit message）
        # → 0.2.48/59 G3-e 环 4 第 11 批：MAJ-R6-1 两本账分开（`failureStreak` = 裁决账、
        #     `lastFailure` = 回显账）—— 不计数的取消/过期会话不再具备开失败终态的资格
        #     （第 10 批的分流判据 `failureStreak>0 || lastFailure!=nil` 正是本缺陷的根）；
        #     负向 3 条 + 正向 1 条永久测试 + 矩阵基态 4→8 列（24→96 格，含取消形态四列）+
        #     4 处变异自证；附带项 `handlerStatus(for:)` 死表已由 2f22a39 删除（本批核验零引用）
        # → 0.2.49/60 G3-e 环 4 第 11 批 B（协调者亲自下场，MAJ-R6-1 的第二半）：取消导致的
        #     装载结束补一条真正的收敛腿 `convergeStalledLoad` —— `.loading` 交还给事实
        #     （= `.stopped`，不开终态），`start()` 不再向调用方回 `.advanced`；顺带删掉一个
        #     不可能状态（停止态上的暂停不再凭空造出 `.paused`），矩阵两列与第 11 批两条用例
        #     按可达形状重写；`TransferWaiter.settle()` 三合一布尔拆成三格定案（定案并唤起 /
        #     定案但未登记 / 败者），取消作废在途时不再少记终止信号；PLAYER_MIN 388 → 394
        # → 0.2.50/61 G3-e 环 4 第 12 批（上+下，第 7 轮复审 1 Major / 4 Minor 的收口）：
        #     MAJ-R7-1（11B 的守卫按症状写 → 一次合法暂停即让收敛腿消失）改为按事实判；
        #     并按评审指认补 `.advanced` / `.repeated` **总闸**（引擎确实装着当前项或真有一代
        #     装载在途才允许声称推进）；MIN-R7-1 三个配置旋钮构造期 clamp；MIN-R7-2 toggle 把
        #     `.loading` 归入「正要响」一侧；§20 删不可达收敛腿；PLAYER_MIN 394 → 397
        # → 0.2.73/90 §7 #39 推翻：作品音频不是"后端没给同源出口"，是客户端挑了 `intent=play`
        #     那一条（服务端 302→uploads 名单外桶 ⇒ 出口守卫拒）。新增
        #     `CovaEnvironment.workAudioDirectFetchURL`（同源 + `/api/media/objects/` + 独立成项
        #     且全文唯一的 `intent=play` 才改成 `download`，字符串定点替换不走 queryItems 往返），
        #     播放与直存两条腿共用 ⇒ A5/A6 解阻，**D23 名单未放宽**；CovaEnvironmentTests +3 条
        # → 0.2.72/89 A1 设备侧取证抓出的真缺陷：bootstrap 的**恢复会话分支**没调
        #     loadRecentHistory ⇒ 首次登录之后的每一次冷启动都静默退回本机账（屏上 1 行 vs 服务端 5 行）；
        #     同时新增验收腿 CovaAcceptanceTests（独立 scheme，不进门禁）
        # → 0.2.71/88 P0 三件：GET /api/play-history 混排读 + studio/create 最小闭环
        #     （simple generate → generation-jobs 轮询 → works 结果行）+ 作品播放上报（work_listens）
        #     + 作品直存（audioUrl，不 checkout 不扣费）；新增 design/screens/19-studio-create.md
        # → 0.2.69/80 R18-2（第 18 轮 Major）：十条美术腿改经 `CovaArtworkResolution`（D23 唯一
        #     裁决面）—— 站内相对封面/头像补成生产 origin 且查询串逐字节保留，出口拒绝点名 host；
        #     并新建 CovaFeature 最小测试目标（`CovaFeatureTests`，23 条，只钉媒体腿，无 UI 快照）
        CFBundleShortVersionString: "0.2.73"
        CFBundleVersion: "90"
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  CovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CovaTests
    dependencies:
      - target: Cova
      - package: CovaCore
      - package: CovaPlayer
      - package: CovaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.covalink.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cova.app/Cova"

  CovaAcceptanceTests:
    # P0 设备侧验收（A1/A3/A5/A6 的"屏上真条目"那一半）。
    # 为什么是 XCUITest 而不是脚本点鼠标：驱动本机会话的进程没有 macOS「辅助访问」权限
    # （cliclick / AppleScript 都发不出点击），而 `simctl` 本身不提供点击；
    # 装 idb/appium 又破零第三方依赖白名单（硬边界 4）。XCUITest 的事件注入发生在模拟器内，
    # 由 Xcode 测试基础设施驱动 ⇒ 不需要宿主权限，且**可复现**（截图不再是手工一次性的）。
    # 刻意**不进 `Cova` scheme 的 test 动作**：门禁的 5/10 用 `-only-testing:CovaTests`，
    # 把一条要真等生成任务（分钟级、且真扣 co）的链路塞进 14 分钟的门禁会把它变成不可靠判据；
    # 它是"验收取证"而不是"回归门禁"，这条分工写进 commit 与 acceptance README。
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CovaAcceptanceTests
    dependencies:
      - target: Cova
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.covalink.ios.acceptance-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cova

schemes:
  Cova:
    build:
      targets:
        Cova: all
        CovaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CovaTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # 验收专用 scheme（`xcodebuild test -scheme CovaAcceptance`）。
  # 与 `Cova` scheme 完全分开：门禁跑的是 `Cova`，不会碰到这条分钟级、会真扣 co 的链路。
  CovaAcceptance:
    build:
      targets:
        Cova: all
        CovaAcceptanceTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CovaAcceptanceTests
