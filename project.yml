        # → 0.3.3/105 09 卡面口径落地（2026-10-03）：计划卡独立容器（elevated+line+
        #     gradient.ai 顶条，不再借 CovaCard）/ 胶囊状态徽标 / 50pt 胶囊主钮 +
        #     primaryButtonShadow / 费用行 mono+accentText / 「修改要求」accentText；
        #     候选卡组改 50/50 横排大卡（1:1 封面或 CovaPixelCover + 40pt 玻璃播放钮）
        #     与终态条同卡框（色按 §5 表）、♡/重试/选这版收入卡内操作条、
        #     「选一版继续制作」转 CovaButton.primary 中性玻璃；AX 档纵向堆叠。
        # → 0.3.4/106 09 对抗性审查→实现一轮（2026-10-04）：§3.A 动态会话标题 + ⋯只读信息
        #     sheet；§3.B 降级条规格（accentSoft+warning 描边+慢旋）+ 轮询连败第4次起重试钮
        #     （状态机 pollFailureCount）+ capReached 长任务话术；§3.C 气泡 fg+尾角；
        #     §3.D sparkles gradient.ai；§3.E thinking 逐条展开 + OneStepThinkingCopy
        #     （web progress-status.ts 同构表）；§3.F RunLineCopy 映射表 + completed 3s 淡出；
        #     §9 计划卡 12 态（canStart/canRevise/analyzing 骨架/patching/starting 菊花/
        #     manualRecovery/archived 50%/零余额 error）；§3.J composer 玻璃卡同族；
        #     §4.1 三段骨架+空会话引导；§7 容器标签+「1 条新回复」浮钮；§10 消息窗口化
        #     +计划卡折叠+analysisZh 4 行+并发 start 单在途+「计划已在别处更新」。
        # → 0.3.5/107 任务25 设计对齐落地（2026-10-06）：深色金属色 5 对值归零到
        #     裁定档（_meta.rulings，web .dark 实测唯一准）；38 处 .font(.system(size:)
        #     字面量收编进 CovaUI.CovaSymbol 命名尺寸档（全为 SF Symbol，pt 零变化，
        #     刻意不随 Dynamic Type），tokens.json 新增 symbol 区镜像；手册 zOrder
        #     自报改为已对齐 + §3.4 补 D-01/D-02 指针。
        CFBundleShortVersionString: "0.3.5"
        CFBundleVersion: "107"
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  CovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CovaTests
    dependencies:
      - target: Cova
      - package: CovaCore
      - package: CovaPlayer
      - package: CovaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.covalink.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cova.app/Cova"

  CovaAcceptanceTests:
    # P0 设备侧验收（A1/A3/A5/A6 的"屏上真条目"那一半）。
    # 为什么是 XCUITest 而不是脚本点鼠标：驱动本机会话的进程没有 macOS「辅助访问」权限
    # （cliclick / AppleScript 都发不出点击），而 `simctl` 本身不提供点击；
    # 装 idb/appium 又破零第三方依赖白名单（硬边界 4）。XCUITest 的事件注入发生在模拟器内，
    # 由 Xcode 测试基础设施驱动 ⇒ 不需要宿主权限，且**可复现**（截图不再是手工一次性的）。
    # 刻意**不进 `Cova` scheme 的 test 动作**：门禁的 5/10 用 `-only-testing:CovaTests`，
    # 把一条要真等生成任务（分钟级、且真扣 co）的链路塞进 14 分钟的门禁会把它变成不可靠判据；
    # 它是"验收取证"而不是"回归门禁"，这条分工写进 commit 与 acceptance README。
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CovaAcceptanceTests
    dependencies:
      - target: Cova
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.covalink.ios.acceptance-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cova

schemes:
  Cova:
    build:
      targets:
        Cova: all
        CovaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CovaTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # 验收专用 scheme（`xcodebuild test -scheme CovaAcceptance`）。
  # 与 `Cova` scheme 完全分开：门禁跑的是 `Cova`，不会碰到这条分钟级、会真扣 co 的链路。
  CovaAcceptance:
    build:
      targets:
        Cova: all
        CovaAcceptanceTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CovaAcceptanceTests
