name: Cova

options:
  bundleIdPrefix: cn.covalink
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.0"

packages:
  CovaCore:
    path: Packages/CovaCore
  CovaPlayer:
    path: Packages/CovaPlayer
  CovaUI:
    path: Packages/CovaUI
  CovaFeature:
    path: Packages/CovaFeature

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES

configs:
  Debug: debug
  Release: release

fileGroups:
  - README.md
  - DEVELOPMENT.md
  - docs

targets:
  Cova:
    type: application
    platform: iOS
    sources:
      - path: Cova
      - path: design/assets/CovaAssets.xcassets
        buildPhase: resources
    dependencies:
      - package: CovaFeature
    settings:
      base:
        PRODUCT_NAME: Cova
        PRODUCT_BUNDLE_IDENTIFIER: cn.covalink.ios
