name: Cova

options:
  bundleIdPrefix: cn.covalink
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.0"

packages:
  CovaCore:
    path: Packages/CovaCore
  CovaPlayer:
    path: Packages/CovaPlayer
  CovaUI:
    path: Packages/CovaUI
  CovaFeature:
    path: Packages/CovaFeature

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES

configs:
  Debug: debug
  Release: release

fileGroups:
  - README.md
  - AGENTS.md
  - docs

targets:
  Cova:
    type: application
    platform: iOS
    sources:
      - path: Cova
      - path: design/assets/CovaAssets.xcassets
        buildPhase: resources
    dependencies:
      - package: CovaFeature
    settings:
      base:
        PRODUCT_NAME: Cova
        PRODUCT_BUNDLE_IDENTIFIER: cn.covalink.ios
        # 版本（AGENTS.md：每次 commit 递增，小迭代 +0.0.1 / 大迭代 +0.1）
        # 0.1.0/1 骨架 → ... → 0.2.3/14 similarTo 投影封套/登录请求钉死 → 0.2.4/15 G3-a 验收落证
        # → 0.2.5/16 G3-b 幂等键/Keychain 封装/owner 绑定持久化
        CFBundleShortVersionString: "0.2.5"
        CFBundleVersion: "16"
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  CovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CovaTests
    dependencies:
      - target: Cova
      - package: CovaCore
      - package: CovaPlayer
      - package: CovaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.covalink.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cova.app/Cova"

schemes:
  Cova:
    build:
      targets:
        Cova: all
        CovaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CovaTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
